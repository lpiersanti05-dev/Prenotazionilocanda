<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestione Prenotazioni Locanda</title>
  
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --primary: #1e293b;
      --accent: #0284c7;
      --bg: #f8fafc;
      --card: #ffffff;
      --danger: #ef4444;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--primary);
      margin: 0;
      padding: 15px;
    }
    .container { max-width: 600px; margin: 0 auto; }
    h1 { text-align: center; font-size: 1.5rem; margin-bottom: 20px; }
    .card { background: var(--card); padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 20px; }
    label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 0.9rem; }
    input, select, button { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; margin-bottom: 12px; font-size: 1rem; }
    button { background-color: var(--accent); color: white; font-weight: bold; border: none; cursor: pointer; }
    .booking-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #f1f5f9; }
    .delete-btn { background-color: var(--danger); color: white; width: auto; padding: 6px 12px; margin-bottom: 0; font-size: 0.85rem; }
    .error-msg { color: var(--danger); font-weight: bold; font-size: 0.85rem; display: none; margin-bottom: 10px; }
  </style>
</head>
<body>

<div class="container">
  <h1>Gestione Prenotazioni Locanda</h1>

  <div class="card">
    <label for="current-date">Seleziona Data:</label>
    <input type="date" id="current-date" onchange="listenToDateData()">
  </div>

  <div class="card">
    <h3>Nuova Prenotazione</h3>
    <div id="error-box" class="error-msg"></div>

    <label for="customer-name">Nome Cliente:</label>
    <input type="text" id="customer-name" placeholder="Es. Mario Rossi">

    <label for="table-select">Tavolo:</label>
    <select id="table-select">
      <option value="Tavolo 1">Tavolo 1</option>
      <option value="Tavolo 2">Tavolo 2</option>
      <option value="Tavolo 3">Tavolo 3</option>
      <option value="Tavolo 4">Tavolo 4</option>
      <option value="Tavolo 5">Tavolo 5</option>
    </select>

    <label for="booking-time">Orario:</label>
    <input type="time" id="booking-time">

    <label for="people-count">Numero Persone:</label>
    <input type="number" id="people-count" placeholder="Es. 4" min="1">

    <button onclick="addBooking()">Aggiungi Prenotazione</button>
  </div>

  <div class="card">
    <h3>Prenotazioni del Giorno</h3>
    <div id="bookings-list">Nessuna prenotazione trovata per questa data.</div>
  </div>
</div>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyAwGEErUuII0YGO9b59xmhfpog_52a26MI",
    authDomain: "prenotazionilocanda-7808c.firebaseapp.com",
    projectId: "prenotazionilocanda-7808c",
    storageBucket: "prenotazionilocanda-7808c.firebasestorage.app",
    messagingSenderId: "407224446329",
    appId: "1:407224446329:web:e213fbaf5aaef702af53a8",
    measurementId: "G-436NY8G6XG"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  let currentBookings = [];

  document.addEventListener("DOMContentLoaded", () => {
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('current-date').value = today;
    listenToDateData();
  });

  function listenToDateData() {
    const date = document.getElementById('current-date').value;
    if (!date) return;

    db.ref('prenotazioni/' + date).on('value', (snapshot) => {
      const data = snapshot.val();
      currentBookings = data ? Object.values(data) : [];
      renderBookings();
    });
  }

  function addBooking() {
    const errorBox = document.getElementById('error-box');
    errorBox.style.display = 'none';

    const date = document.getElementById('current-date').value;
    const name = document.getElementById('customer-name').value.trim();
    const table = document.getElementById('table-select').value;
    const time = document.getElementById('booking-time').value;
    const people = document.getElementById('people-count').value;

    if (!name || !time || !people) {
      showError("Compila tutti i campi prima di salvare!");
      return;
    }

    const isConflict = currentBookings.some(b => b.table === table && b.time === time);

    if (isConflict) {
      showError(`Il ${table} è già prenotato per le ore ${time}! Scegli un altro orario o tavolo.`);
      return;
    }

    const bookingId = Date.now().toString();
    const newBooking = {
      id: bookingId,
      name: name,
      table: table,
      time: time,
      people: people
    };

    db.ref('prenotazioni/' + date + '/' + bookingId).set(newBooking, (error) => {
      if (!error) {
        document.getElementById('customer-name').value = '';
        document.getElementById('booking-time').value = '';
        document.getElementById('people-count').value = '';
      } else {
        showError("Errore durante il salvataggio sul cloud.");
      }
    });
  }

  function deleteBooking(id) {
    const date = document.getElementById('current-date').value;
    db.ref('prenotazioni/' + date + '/' + id).remove();
  }

  function renderBookings() {
    const listContainer = document.getElementById('bookings-list');
    
    if (currentBookings.length === 0) {
      listContainer.innerHTML = '<p>Nessuna prenotazione presente.</p>';
      return;
    }

    currentBookings.sort((a, b) => a.time.localeCompare(b.time));

    let html = '';
    currentBookings.forEach(b => {
      html += `
        <div class="booking-item">
          <div>
            <strong>${b.time}</strong> - <b>${b.table}</b><br>
            <small>${b.name} (${b.people} persone)</small>
          </div>
          <button class="delete-btn" onclick="deleteBooking('${b.id}')">Elimina</button>
        </div>
      `;
    });

    listContainer.innerHTML = html;
  }

  function showError(msg) {
    const errorBox = document.getElementById('error-box');
    errorBox.innerText = msg;
    errorBox.style.display = 'block';
  }
</script>

</body>
</html>
